[project]
name = "shopwave-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic[email]>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "stripe>=9.0",
    "firebase-admin>=6.5",
    "weasyprint>=62",
    "celery>=5.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
